name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build sdist & wheel + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Verify tag matches pyproject.toml version (exact or rc suffix)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os, pathlib, re, subprocess, tomllib
          tag = os.environ["TAG_NAME"]
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          base_tag = f"v{ver}"
          if tag == base_tag:
              print(f"Exact release tag match: {tag} == pyproject.toml {ver}")
          elif re.fullmatch(rf"{re.escape(base_tag)}rc[0-9]+", tag):
              rc_ver = tag.lstrip("v")
              print(f"Release-candidate tag {tag} for base {base_tag}; stamping {rc_ver} for build")
              subprocess.run(["uv", "version", rc_ver, "--no-sync"], check=True)
              init_p = pathlib.Path("src/adk_smart_router/__init__.py")
              init_p.write_text(init_p.read_text().replace(f"\"{ver}\"", f"\"{rc_ver}\""))
          else:
              raise SystemExit(f"Tag {tag!r} does not match pyproject.toml version {base_tag!r} (or {base_tag}rcN)")
          '
      - name: Build distribution
        run: uv build
      - name: Smoke test wheel & PyPI metadata in clean venv
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/python -c "
          import importlib.metadata, os, re, adk_smart_router
          from adk_smart_router import SmartRouterPlugin, RouterConfig, ToolJudge, load_config
          expected = os.environ['TAG_NAME'].lstrip('v')
          assert adk_smart_router.__version__ == expected, f'{adk_smart_router.__version__!r} != {expected!r}'
          desc = importlib.metadata.metadata('adk-smart-router')['Description']
          rel = re.findall(r'\]\((?!https?://|#|mailto:)([^)]+)\)', desc)
          assert not rel, f'Relative links found in PyPI Description metadata: {rel}'
          assert '\`\`\`mermaid' not in desc, 'Un-substituted mermaid block found in PyPI Description metadata'
          print('Smoke test & PyPI metadata check passed:', adk_smart_router.__version__, adk_smart_router.__all__)
          "
          /tmp/smoke-venv/bin/smart-router --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (pre-release tags only)
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/adk-smart-router
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (stable tags)
    needs: build
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adk-smart-router
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --verify-tag \
            --title "${{ github.ref_name }}" \
            --generate-notes
