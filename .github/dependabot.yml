version: 2
updates:
  # Python dependencies, uv-native (reads pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      # google-adk's McpToolset imports mcp.shared.session, which mcp 2.x removed.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions in CI up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
